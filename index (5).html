<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手游情报站</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f; --surface: #111118; --surface2: #1a1a24;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --accent: #7c6aff; --accent2: #ff6b6b; --accent3: #00d4aa;
    --text: #f0eeff; --muted: #888099;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans SC', sans-serif; min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(124,106,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(124,106,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }
  .wrap { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 48px 24px; }
  header { text-align: center; margin-bottom: 48px; }
  .logo-tag {
    display: inline-block; font-family: 'DM Mono', monospace; font-size: 11px;
    color: var(--accent); letter-spacing: 3px; text-transform: uppercase;
    border: 1px solid rgba(124,106,255,0.3); padding: 4px 14px; border-radius: 2px; margin-bottom: 16px;
  }
  h1 { font-size: clamp(28px, 5vw, 48px); font-weight: 900; letter-spacing: -1px; line-height: 1.1; margin-bottom: 12px; }
  h1 span { color: var(--accent); }
  .subtitle { font-size: 14px; color: var(--muted); font-weight: 300; }
  .search-wrap { background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; padding: 20px; margin-bottom: 32px; }
  .row { display: flex; gap: 10px; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  .search-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px;
    padding: 12px 16px; font-size: 15px; font-family: 'Noto Sans SC', sans-serif;
    color: var(--text); outline: none; transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }
  select, .key-input {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 11px 14px; font-size: 13px; font-family: 'Noto Sans SC', sans-serif;
    color: var(--muted); outline: none;
  }
  select { width: 130px; flex-shrink: 0; cursor: pointer; }
  .key-input { flex: 1; font-family: 'DM Mono', monospace; }
  .key-input:focus { border-color: var(--border2); color: var(--text); }
  .key-input::placeholder { color: rgba(136,128,153,0.4); }
  .search-btn {
    background: var(--accent); border: none; border-radius: 8px; padding: 12px 28px;
    font-size: 14px; font-weight: 700; font-family: 'Noto Sans SC', sans-serif;
    color: white; cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .search-btn:hover { background: #9180ff; transform: translateY(-1px); }
  .search-btn:active { transform: translateY(0); }
  .search-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .hint-tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .hint-label { font-size: 11px; color: var(--muted); }
  .hint-tag {
    font-size: 11px; padding: 3px 10px; background: rgba(255,255,255,0.04);
    border: 1px solid var(--border); border-radius: 20px; color: var(--muted); cursor: pointer; transition: all 0.15s;
  }
  .hint-tag:hover { border-color: var(--accent); color: var(--accent); }
  .loading { display: none; text-align: center; padding: 60px 0; }
  .loading.show { display: block; }
  .loader-ring {
    width: 48px; height: 48px; border: 2px solid var(--border2); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-steps { font-size: 13px; color: var(--muted); }
  .loader-steps span { color: var(--accent); }
  .results { display: none; }
  .results.show { display: block; }
  .game-header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .game-icon {
    width: 56px; height: 56px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 900; color: white; flex-shrink: 0;
  }
  .game-meta h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .fresh-tag { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--accent3); letter-spacing: 1px; }
  .sections { display: grid; gap: 16px; }
  .section-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .section-head {
    display: flex; align-items: center; gap: 10px; padding: 14px 20px;
    border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02);
  }
  .section-icon { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .icon-intro { background: rgba(124,106,255,0.15); }
  .icon-grind { background: rgba(0,212,170,0.15); }
  .icon-tier  { background: rgba(255,215,0,0.15); }
  .section-head h3 { font-size: 14px; font-weight: 500; }
  .section-body { padding: 20px; }
  .intro-list { list-style: none; }
  .intro-list li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; line-height: 1.7; }
  .intro-list li:last-child { border: none; padding-bottom: 0; }
  .step-num {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    background: rgba(124,106,255,0.2); border: 1px solid rgba(124,106,255,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; font-family: 'DM Mono', monospace; color: var(--accent); margin-top: 2px;
  }
  .grind-grid { display: grid; gap: 10px; }
  .grind-item { display: flex; align-items: flex-start; gap: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .priority-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
  .p1 { background: #ff6b6b; box-shadow: 0 0 6px rgba(255,107,107,0.5); }
  .p2 { background: #ffd700; box-shadow: 0 0 6px rgba(255,215,0,0.4); }
  .p3 { background: var(--muted); }
  .grind-text { font-size: 13px; line-height: 1.6; }
  .grind-label { font-weight: 700; color: var(--text); font-size: 13px; }
  .error-box { display: none; background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.25); border-radius: 10px; padding: 16px 20px; font-size: 13px; color: #ff9f9f; margin-bottom: 20px; }
  .error-box.show { display: block; }
  .sources { margin-top: 20px; font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .src-tag { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 3px; padding: 2px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo-tag">GAME INTEL</div>
    <h1>手游<span>情报站</span></h1>
    <p class="subtitle">搜一下，秒懂怎么玩 · 实时聚合 B 站 / Wiki / 攻略站</p>
  </header>

  <div class="search-wrap">
    <div class="row">
      <input class="search-input" id="gameInput" type="text" placeholder="输入手游名称，例如：原神、明日方舟、星穹铁道..." />
      <button class="search-btn" id="searchBtn" onclick="doSearch()">搜情报</button>
    </div>
    <div class="row">
      <select id="provider" onchange="updatePlaceholder()">
        <option value="claude">Claude</option>
        <option value="openai">OpenAI</option>
        <option value="deepseek">DeepSeek</option>
        <option value="gemini">Gemini</option>
        <option value="grok">Grok</option>
        <option value="qwen">通义千问</option>
        <option value="zhipu">智谱 GLM</option>
        <option value="moonshot">Moonshot</option>
        <option value="doubao">豆包</option>
        <option value="baidu">文心一言</option>
        <option value="minimax">MiniMax</option>
      </select>
      <input class="key-input" id="apiKey" type="password" placeholder="粘贴 API Key..." />
      <span style="font-size:11px;color:var(--muted);align-self:center;white-space:nowrap;">本地使用，不上传</span>
    </div>
    <div class="hint-tags">
      <span class="hint-label">热门：</span>
      <span class="hint-tag" onclick="fillGame('原神')">原神</span>
      <span class="hint-tag" onclick="fillGame('明日方舟')">明日方舟</span>
      <span class="hint-tag" onclick="fillGame('崩坏：星穹铁道')">星穹铁道</span>
      <span class="hint-tag" onclick="fillGame('蔚蓝档案')">蔚蓝档案</span>
      <span class="hint-tag" onclick="fillGame('鸣潮')">鸣潮</span>
      <span class="hint-tag" onclick="fillGame('少前2：追放')">少前2</span>
    </div>
  </div>

  <div class="error-box" id="errorBox"></div>
  <div class="loading" id="loading">
    <div class="loader-ring"></div>
    <div class="loader-steps" id="loaderStep">正在搜索 <span>B站 · Wiki · 攻略站</span> 最新情报...</div>
  </div>

  <div class="results" id="results">
    <div class="game-header">
      <div class="game-icon" id="gameIcon">?</div>
      <div class="game-meta">
        <h2 id="gameTitle">—</h2>
        <div class="fresh-tag" id="freshTag">LIVE DATA · 实时获取</div>
      </div>
    </div>
    <div class="sections">
      <div class="section-card">
        <div class="section-head"><div class="section-icon icon-intro">🗺</div><h3>入门路线 · 新手别踩坑</h3></div>
        <div class="section-body"><ol class="intro-list" id="introList"></ol></div>
      </div>
      <div class="section-card">
        <div class="section-head"><div class="section-icon icon-grind">⚡</div><h3>每天刷什么 · 资源优先级</h3></div>
        <div class="section-body"><div class="grind-grid" id="grindGrid"></div></div>
      </div>
      <div class="section-card">
        <div class="section-head"><div class="section-icon icon-tier">👑</div><h3>角色强度 · Tier List</h3></div>
        <div class="section-body" id="tierBody"></div>
      </div>
    </div>
    <div class="sources" id="sourcesRow"></div>
  </div>
</div>

<script>
const PROVIDERS = {
  claude:   { url: 'https://api.anthropic.com/v1/messages',                                            ph: 'sk-ant-api03-...' },
  openai:   { url: 'https://api.openai.com/v1/chat/completions',                                       ph: 'sk-...' },
  deepseek: { url: 'https://api.deepseek.com/v1/chat/completions',                                     ph: 'sk-...' },
  gemini:   { url: 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions',         ph: 'AIza...' },
  grok:     { url: 'https://api.x.ai/v1/chat/completions',                                            ph: 'xai-...' },
  qwen:     { url: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions',              ph: 'sk-...' },
  zhipu:    { url: 'https://open.bigmodel.cn/api/paas/v4/chat/completions',                           ph: '你的 GLM Key' },
  moonshot: { url: 'https://api.moonshot.cn/v1/chat/completions',                                     ph: 'sk-...' },
  doubao:   { url: 'https://ark.cn-beijing.volces.com/api/v3/chat/completions',                       ph: '你的豆包 Key' },
  baidu:    { url: 'https://qianfan.baidubce.com/v2/chat/completions',                                ph: '你的文心 Key' },
  minimax:  { url: 'https://api.minimax.chat/v1/text/chatcompletion_v2',                              ph: '你的 MiniMax Key' },
};

const MODELS = {
  openai: 'gpt-4o-search-preview', deepseek: 'deepseek-chat', gemini: 'gemini-2.0-flash',
  grok: 'grok-3', qwen: 'qwen-plus', zhipu: 'glm-4-plus',
  moonshot: 'moonshot-v1-8k', doubao: 'doubao-pro-32k', baidu: 'ernie-4.5-turbo-128k', minimax: 'abab6.5s-chat',
};

const SYSTEM_PROMPT = `你是手游攻略专家。根据游戏名搜索最新攻略，严格按JSON格式返回，不要多余内容：
{"intro":[{"step":"标题","desc":"一句话"}],"grind":[{"priority":1,"name":"资源名","desc":"为什么刷"}],"tier_url":"该游戏Tier List页面完整URL，优先prydwen.gg或wiki.biligame.com","sources":["来源"]}
intro最多6条，grind最多8条(priority:1必刷/2推荐/3空闲)，全部中文。`;

// 多个代理备用，自动切换
const PROXIES = [
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  url => `https://proxy.cors.sh/${url}`,
];

async function fetchWithProxy(targetUrl, options) {
  let lastErr;
  for (const makeProxy of PROXIES) {
    try {
      const proxyUrl = makeProxy(targetUrl);
      const resp = await fetch(proxyUrl, options);
      if (resp.ok || resp.status === 400 || resp.status === 401 || resp.status === 403) {
        return resp; // 4xx 是 API 错误，不是代理问题，直接返回
      }
    } catch(e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error('所有代理均不可用，请检查网络');
}

const loadingMsgs = [
  '正在搜索 <span>B站 · Wiki · 攻略站</span> 最新情报...',
  '正在分析 <span>角色强度</span> 和当前版本 Meta...',
  '正在整理 <span>新手路线</span> 和资源优先级...',
  '马上好了，正在最终整合...',
];
let loadingTimer;

function updatePlaceholder() {
  const p = document.getElementById('provider').value;
  document.getElementById('apiKey').placeholder = PROVIDERS[p]?.ph || '粘贴 API Key...';
}
function fillGame(name) { document.getElementById('gameInput').value = name; }
document.getElementById('gameInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

function showError(msg) { const b = document.getElementById('errorBox'); b.textContent = msg; b.classList.add('show'); }
function clearError() { document.getElementById('errorBox').classList.remove('show'); }

async function doSearch() {
  const game = document.getElementById('gameInput').value.trim();
  const key  = document.getElementById('apiKey').value.trim();
  const prov = document.getElementById('provider').value;
  clearError();
  if (!game) { showError('请输入游戏名称'); return; }
  if (!key)  { showError('请输入 API Key'); return; }

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  document.getElementById('loading').classList.add('show');
  document.getElementById('results').classList.remove('show');

  let i = 0;
  const el = document.getElementById('loaderStep');
  el.innerHTML = loadingMsgs[0];
  loadingTimer = setInterval(() => { i = Math.min(i+1, loadingMsgs.length-1); el.innerHTML = loadingMsgs[i]; }, 3500);

  try {
    const data = await fetchGameIntel(game, key, prov);
    renderResults(game, data);
  } catch(e) {
    showError('请求失败：' + e.message);
  } finally {
    btn.disabled = false;
    document.getElementById('loading').classList.remove('show');
    clearInterval(loadingTimer);
  }
}

async function fetchGameIntel(game, key, prov) {
  const userMsg = `游戏名：${game}`;
  let text;

  if (prov === 'claude') {
    const resp = await fetchWithProxy(PROVIDERS.claude.url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514', max_tokens: 2000, system: SYSTEM_PROMPT,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{ role: 'user', content: userMsg }]
      })
    });
    if (!resp.ok) { const e = await resp.json().catch(()=>({})); throw new Error(e.error?.message || `HTTP ${resp.status}`); }
    const d = await resp.json();
    text = (d.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  } else {
    const body = { model: MODELS[prov], messages: [{ role: 'system', content: SYSTEM_PROMPT }, { role: 'user', content: userMsg }] };
    if (prov === 'grok') body.search_parameters = { mode: 'on' };
    const resp = await fetchWithProxy(PROVIDERS[prov].url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify(body)
    });
    if (!resp.ok) { const e = await resp.json().catch(()=>({})); throw new Error(e.error?.message || `HTTP ${resp.status}`); }
    const d = await resp.json();
    text = d.choices?.[0]?.message?.content || '';
  }

  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('AI 返回格式异常，请重试');
  return JSON.parse(m[0]);
}

function renderResults(game, data) {
  document.getElementById('gameTitle').textContent = game;
  document.getElementById('gameIcon').textContent = game.slice(0, 1);
  document.getElementById('freshTag').textContent = `LIVE · ${new Date().toLocaleDateString('zh-CN')} 实时获取`;

  document.getElementById('introList').innerHTML = (data.intro || []).map((item, i) => `
    <li>
      <span class="step-num">${i+1}</span>
      <div><span style="font-weight:500;color:var(--text)">${item.step}</span><br>
      <span style="color:var(--muted)">${item.desc}</span></div>
    </li>`).join('');

  document.getElementById('grindGrid').innerHTML = (data.grind || []).map(item => {
    const cls = item.priority === 1 ? 'p1' : item.priority === 2 ? 'p2' : 'p3';
    return `<div class="grind-item">
      <div class="priority-dot ${cls}"></div>
      <div class="grind-text"><span class="grind-label">${item.name}</span>　${item.desc}</div>
    </div>`;
  }).join('');

  const url = data.tier_url || '';
  const tierBody = document.getElementById('tierBody');
  if (url.startsWith('http')) {
    let host = ''; try { host = new URL(url).hostname; } catch(e) {}
    tierBody.innerHTML = `<a href="${url}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;text-decoration:none;max-width:100%;overflow:hidden;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border2)'">
      <span style="color:var(--muted);font-size:11px;font-family:'DM Mono',monospace;flex-shrink:0">${host}</span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px">${url}</span>
      <span style="color:var(--accent);flex-shrink:0">↗</span>
    </a>`;
  } else {
    tierBody.innerHTML = `<span style="font-size:13px;color:var(--muted)">未找到 Tier List 页面</span>`;
  }

  const srcs = data.sources || [];
  document.getElementById('sourcesRow').innerHTML = srcs.length
    ? '<span style="color:var(--muted)">数据来源：</span>' + srcs.map(s => `<span class="src-tag">${s}</span>`).join('') : '';

  document.getElementById('results').classList.add('show');
  document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
</body>
</html>
